<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D-Day & 날짜 계산기 - Neoflows Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <style>
    .nf-tool-body { min-height:100vh; display:flex; flex-direction:column; }
    .nf-tool-main { flex:1; padding:1.5rem 1rem 3rem; }
    .nf-container-tool { max-width:56rem; margin:0 auto; }
    .today-banner { background:linear-gradient(135deg,#e11d48,#f43f5e); color:white; border-radius:1.25rem; padding:1.25rem 1.5rem; margin-bottom:1.5rem; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:0.75rem; box-shadow:0 4px 14px rgba(225,29,72,0.3); }
    .today-banner .label { font-size:0.8125rem; font-weight:600; opacity:0.9; }
    .today-banner .date { font-size:1.5rem; font-weight:900; letter-spacing:-0.02em; }
    .today-banner .time { font-size:0.875rem; font-weight:500; opacity:0.85; }
    .section-title { font-size:1.0625rem; font-weight:800; color:#1e293b; margin-bottom:0.875rem; display:flex; align-items:center; gap:0.5rem; }
    .section-title .icon { display:inline-flex; align-items:center; justify-content:center; width:1.75rem; height:1.75rem; border-radius:0.5rem; background:#fff1f2; color:#e11d48; }
    .section-title .icon svg { width:1rem; height:1rem; }
    .dday-form-card { background:white; border:1.5px solid #e2e8f0; border-radius:1.25rem; padding:1.25rem 1.5rem; margin-bottom:1.5rem; }
    .dday-form-row { display:flex; gap:0.75rem; align-items:flex-end; flex-wrap:wrap; }
    .dday-form-group { flex:1; min-width:8rem; }
    .dday-form-group label { display:block; font-size:0.75rem; font-weight:700; color:#64748b; margin-bottom:0.375rem; }
    .dday-form-group input { width:100%; padding:0.625rem 0.875rem; border:1.5px solid #e2e8f0; border-radius:0.75rem; font-size:0.875rem; font-family:inherit; background:white; color:#1e293b; outline:none; transition:all 0.15s ease; }
    .dday-form-group input:focus { border-color:#e11d48; box-shadow:0 0 0 3px rgba(225,29,72,0.1); }
    .dday-form-group input[type="date"] { cursor:pointer; }
    .dday-add-btn { display:inline-flex; align-items:center; gap:0.375rem; padding:0.625rem 1.25rem; border-radius:0.75rem; background:linear-gradient(135deg,#e11d48,#f43f5e); color:white; font-size:0.875rem; font-weight:700; border:none; cursor:pointer; transition:all 0.15s ease; white-space:nowrap; box-shadow:0 2px 8px rgba(225,29,72,0.3); flex-shrink:0; height:2.625rem; }
    .dday-add-btn:hover { box-shadow:0 4px 14px rgba(225,29,72,0.4); transform:translateY(-1px); }
    .dday-add-btn:active { transform:translateY(0); }
    .dday-add-btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; box-shadow:none; }
    .dday-form-hint { font-size:0.6875rem; color:#94a3b8; margin-top:0.5rem; }
    .dday-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(16rem,1fr)); gap:1rem; margin-bottom:2rem; }
    .dday-card { background:white; border:1.5px solid #e2e8f0; border-radius:1.25rem; padding:1.25rem; transition:all 0.2s ease; position:relative; overflow:hidden; animation:fadeInUp 0.35s ease-out; }
    .dday-card:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,0.06); }
    .dday-card-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:0.75rem; }
    .dday-card-name { font-size:1rem; font-weight:800; color:#1e293b; line-height:1.3; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .dday-card-delete { display:inline-flex; align-items:center; justify-content:center; width:1.75rem; height:1.75rem; border-radius:0.5rem; border:none; background:transparent; color:#cbd5e1; cursor:pointer; transition:all 0.15s; flex-shrink:0; margin-left:0.5rem; }
    .dday-card-delete:hover { background:#fef2f2; color:#e11d48; }
    .dday-card-delete svg { width:1rem; height:1rem; }
    .dday-card-date { font-size:0.8125rem; color:#94a3b8; font-weight:500; margin-bottom:0.75rem; }
    .dday-card-days { font-size:2rem; font-weight:900; line-height:1; margin-bottom:0.75rem; }
    .dday-card-days.future { color:#e11d48; }
    .dday-card-days.past { color:#64748b; }
    .dday-card-days.today { color:#059669; }
    .dday-card-days-label { font-size:0.75rem; font-weight:600; margin-bottom:0.75rem; }
    .dday-card-days-label.future { color:#e11d48; }
    .dday-card-days-label.past { color:#94a3b8; }
    .dday-card-days-label.today { color:#059669; }
    .dday-progress-wrap { margin-top:0.25rem; }
    .dday-progress-label { display:flex; justify-content:space-between; font-size:0.6875rem; color:#94a3b8; font-weight:600; margin-bottom:0.375rem; }
    .dday-progress-bar { height:0.375rem; background:#f1f5f9; border-radius:9999px; overflow:hidden; }
    .dday-progress-fill { height:100%; border-radius:9999px; background:linear-gradient(90deg,#e11d48,#f43f5e); transition:width 0.5s ease; }
    .dday-progress-fill.overdue { background:linear-gradient(90deg,#64748b,#94a3b8); }
    .dday-empty { text-align:center; padding:3rem 1rem; color:#94a3b8; grid-column:1/-1; }
    .dday-empty svg { width:3rem; height:3rem; margin:0 auto 0.75rem; opacity:0.4; }
    .dday-empty p { font-size:0.875rem; font-weight:500; }
    .diff-card { background:white; border:1.5px solid #e2e8f0; border-radius:1.25rem; padding:1.5rem; margin-top:0.5rem; }
    .diff-form-row { display:flex; gap:1rem; align-items:flex-end; margin-bottom:1.25rem; flex-wrap:wrap; }
    .diff-date-group { flex:1; min-width:8rem; }
    .diff-date-group label { display:block; font-size:0.75rem; font-weight:700; color:#64748b; margin-bottom:0.375rem; }
    .diff-date-group input { width:100%; padding:0.625rem 0.875rem; border:1.5px solid #e2e8f0; border-radius:0.75rem; font-size:0.875rem; font-family:inherit; background:white; color:#1e293b; outline:none; transition:all 0.15s ease; cursor:pointer; }
    .diff-date-group input:focus { border-color:#e11d48; box-shadow:0 0 0 3px rgba(225,29,72,0.1); }
    .diff-arrow { display:flex; align-items:center; justify-content:center; height:2.625rem; color:#cbd5e1; flex-shrink:0; }
    .diff-arrow svg { width:1.5rem; height:1.5rem; }
    .diff-results { display:grid; grid-template-columns:repeat(auto-fit,minmax(7rem,1fr)); gap:0.75rem; }
    .diff-stat { background:#fff1f2; border:1px solid #fecdd3; border-radius:1rem; padding:1rem; text-align:center; transition:all 0.2s ease; }
    .diff-stat:hover { transform:translateY(-2px); }
    .diff-stat-value { font-size:1.5rem; font-weight:900; color:#e11d48; line-height:1; margin-bottom:0.375rem; }
    .diff-stat-label { font-size:0.6875rem; font-weight:600; color:#be123c; }
    .diff-summary { margin-top:1rem; padding:0.875rem 1rem; background:#f8fafc; border-radius:0.75rem; font-size:0.875rem; font-weight:600; color:#475569; text-align:center; }
    .diff-summary strong { color:#e11d48; }
    @media (max-width:640px) {
      .today-banner { padding:1rem 1.25rem; }
      .today-banner .date { font-size:1.25rem; }
      .dday-form-row { flex-direction:column; }
      .dday-form-group { min-width:auto; }
      .dday-add-btn { width:100%; justify-content:center; }
      .dday-grid { grid-template-columns:1fr; }
      .diff-form-row { flex-direction:column; }
      .diff-arrow { display:none; }
      .diff-results { grid-template-columns:repeat(3,1fr); }
    }
  </style>
  <style id="nfDarkOverrides"></style>
</head>
<body>
  <div class="nf-tool-body">
    <div id="header"></div>
    <main class="nf-tool-main">
      <div class="nf-container-tool">
        <div class="today-banner" id="todayBanner">
          <div><div class="label">오늘</div><div class="date" id="todayDate"></div></div>
          <div class="time" id="todayTime"></div>
        </div>
        <div class="section-title">
          <span class="icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg></span>
          D-Day 이벤트 관리
        </div>
        <div class="dday-form-card">
          <div class="dday-form-row">
            <div class="dday-form-group"><label for="eventName">이벤트 이름</label><input type="text" id="eventName" placeholder="예: 기말고사, 생일, 여행" maxlength="30"></div>
            <div class="dday-form-group" style="max-width:14rem;"><label for="eventDate">목표 날짜</label><input type="date" id="eventDate"></div>
            <button class="dday-add-btn" onclick="addEvent()" id="addBtn"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:1rem;height:1rem"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg> 추가</button>
          </div>
          <div class="dday-form-hint">최대 10개까지 저장됩니다. 모든 데이터는 브라우저에 저장됩니다.</div>
        </div>
        <div class="dday-grid" id="eventGrid"></div>
        <div class="section-title" style="margin-top:1rem;">
          <span class="icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></span>
          날짜 차이 계산기
        </div>
        <div class="diff-card">
          <div class="diff-form-row">
            <div class="diff-date-group"><label for="diffDate1">시작 날짜</label><input type="date" id="diffDate1" onchange="calcDiff()"></div>
            <div class="diff-arrow"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg></div>
            <div class="diff-date-group"><label for="diffDate2">끝 날짜</label><input type="date" id="diffDate2" onchange="calcDiff()"></div>
          </div>
          <div class="diff-results" id="diffResults" style="display:none;"></div>
          <div class="diff-summary" id="diffSummary" style="display:none;"></div>
        </div>
      </div>
    </main>
    <div id="footer"></div>
  </div>
  <script src="js/common.js"></script>
  <script>
    const STORAGE_KEY='nf_dday_events';
    let events=[];
    const MAX_EVENTS=10;
    let clockTimer=null;

    document.addEventListener('DOMContentLoaded',()=>{
      document.getElementById('header').innerHTML=toolHeaderHTML('D-Day & 날짜 계산기','중요한 일정, 시험, 기념일 D-day를 빠르고 정확하게 계산합니다.');
      document.getElementById('footer').innerHTML=toolFooterHTML();
      loadEvents();
      renderEvents();
      updateToday();
      clockTimer=setInterval(updateToday,1000);
      initDDayDarkOverrides();
      const tomorrow=new Date();
      tomorrow.setDate(tomorrow.getDate()+30);
      document.getElementById('eventDate').value=formatDateISO(tomorrow);
    });

    function initDDayDarkOverrides(){
      const observer=new MutationObserver(()=>updateDDayDarkStyles());
      observer.observe(document.body,{attributes:true,attributeFilter:['class']});
      updateDDayDarkStyles();
    }

    function updateDDayDarkStyles(){
      const style=document.getElementById('nfDarkOverrides');
      if(!style)return;
      const isDark=document.body.classList.contains('dark');
      style.textContent=isDark?`
        .today-banner{box-shadow:0 4px 14px rgba(225,29,72,0.2)!important;}
        .section-title{color:#f8fafc!important;}
        .section-title .icon{background:#1e293b!important;}
        .dday-form-card{background:#0f172a!important;border-color:#1e293b!important;}
        .dday-form-group label{color:#94a3b8!important;}
        .dday-form-group input{background:#1e293b!important;border-color:#334155!important;color:#e2e8f0!important;}
        .dday-form-group input:focus{border-color:#e11d48!important;box-shadow:0 0 0 3px rgba(225,29,72,0.15)!important;}
        .dday-form-hint{color:#475569!important;}
        .dday-card{background:#0f172a!important;border-color:#1e293b!important;}
        .dday-card:hover{box-shadow:0 8px 20px rgba(0,0,0,0.3)!important;}
        .dday-card-name{color:#f8fafc!important;}
        .dday-card-date{color:#64748b!important;}
        .dday-card-delete{color:#475569!important;}
        .dday-card-delete:hover{background:rgba(225,29,72,0.1)!important;color:#f43f5e!important;}
        .dday-progress-label{color:#64748b!important;}
        .dday-progress-bar{background:#1e293b!important;}
        .dday-card-days.past{color:#64748b!important;}
        .dday-card-days-label.past{color:#64748b!important;}
        .diff-card{background:#0f172a!important;border-color:#1e293b!important;}
        .diff-date-group label{color:#94a3b8!important;}
        .diff-date-group input{background:#1e293b!important;border-color:#334155!important;color:#e2e8f0!important;}
        .diff-date-group input:focus{border-color:#e11d48!important;box-shadow:0 0 0 3px rgba(225,29,72,0.15)!important;}
        .diff-stat{background:rgba(225,29,72,0.08)!important;border-color:rgba(225,29,72,0.2)!important;}
        .diff-summary{background:#1e293b!important;color:#94a3b8!important;}
        .diff-summary strong{color:#f43f5e!important;}
        .dday-empty{color:#475569!important;}
      `:'';
    }

    function updateToday(){
      const now=new Date();
      const dayNames=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
      const y=now.getFullYear();
      const m=String(now.getMonth()+1).padStart(2,'0');
      const d=String(now.getDate()).padStart(2,'0');
      document.getElementById('todayDate').textContent=y+'.'+m+'.'+d+' '+dayNames[now.getDay()];
      const hh=String(now.getHours()).padStart(2,'0');
      const mm=String(now.getMinutes()).padStart(2,'0');
      const ss=String(now.getSeconds()).padStart(2,'0');
      document.getElementById('todayTime').textContent=hh+':'+mm+':'+ss;
    }

    function loadEvents(){
      try{const raw=localStorage.getItem(STORAGE_KEY);if(raw)events=JSON.parse(raw);}catch(e){events=[];}
      if(!Array.isArray(events))events=[];
    }
    function saveEvents(){localStorage.setItem(STORAGE_KEY,JSON.stringify(events));}

    function addEvent(){
      const nameInput=document.getElementById('eventName');
      const dateInput=document.getElementById('eventDate');
      const name=nameInput.value.trim();
      const date=dateInput.value;
      if(!name){showToast('이벤트 이름을 입력해주세요');nameInput.focus();return;}
      if(!date){showToast('목표 날짜를 선택해주세요');dateInput.focus();return;}
      if(events.length>=MAX_EVENTS){showToast('최대 '+MAX_EVENTS+'개까지만 저장할 수 있습니다');return;}
      events.push({id:'ev_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),name:name,date:date,createdAt:Date.now()});
      saveEvents();
      renderEvents();
      nameInput.value='';
      showToast('D-Day 이벤트가 추가되었습니다');
    }

    function deleteEvent(id){
      events=events.filter(e=>e.id!==id);
      saveEvents();
      renderEvents();
      showToast('이벤트가 삭제되었습니다');
    }

    function renderEvents(){
      const grid=document.getElementById('eventGrid');
      if(events.length===0){
        grid.innerHTML='<div class="dday-empty"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg><p>아직 D-Day 이벤트가 없습니다</p></div>';
        return;
      }
      const today=new Date();
      today.setHours(0,0,0,0);
      let html='';
      events.forEach(ev=>{
        const target=new Date(ev.date+'T00:00:00');
        const diffMs=target.getTime()-today.getTime();
        const diffDays=Math.ceil(diffMs/(1000*60*60*24));
        const absDays=Math.abs(diffDays);
        let type,daysLabel;
        if(diffDays===0){type='today';daysLabel='일 남음';}
        else if(diffDays>0){type='future';daysLabel='일 남음';}
        else{type='past';daysLabel='일 지남';}
        let progressHTML='';
        if(ev.createdAt&&type!=='today'){
          const createdDate=new Date(ev.createdAt);
          createdDate.setHours(0,0,0,0);
          const totalSpan=target.getTime()-createdDate.getTime();
          const elapsed=today.getTime()-createdDate.getTime();
          if(totalSpan>0){
            const pct=Math.min(100,Math.max(0,(elapsed/totalSpan)*100));
            const fillClass=pct>=100?'overdue':'';
            progressHTML='<div class="dday-progress-wrap"><div class="dday-progress-label"><span>진행률</span><span>'+Math.round(pct)+'%</span></div><div class="dday-progress-bar"><div class="dday-progress-fill '+fillClass+'" style="width:'+pct+'%"></div></div></div>';
          }
        }
        const dayDisplay=type==='today'?'D-Day':(diffDays>0?'D-'+absDays:'D+'+absDays);
        const labelDisplay=type==='today'?'🎉 오늘입니다!':absDays+daysLabel;
        html+='<div class="dday-card"><div class="dday-card-header"><div class="dday-card-name">'+escHTML(ev.name)+'</div><button class="dday-card-delete" onclick="deleteEvent(\''+ev.id+'\')" title="삭제" aria-label="이벤트 삭제"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg></button></div><div class="dday-card-date">'+formatDateDisplay(ev.date)+'</div><div class="dday-card-days '+type+'">'+dayDisplay+'</div><div class="dday-card-days-label '+type+'">'+labelDisplay+'</div>'+progressHTML+'</div>';
      });
      grid.innerHTML=html;
    }

    function calcDiff(){
      const d1Str=document.getElementById('diffDate1').value;
      const d2Str=document.getElementById('diffDate2').value;
      const resultsEl=document.getElementById('diffResults');
      const summaryEl=document.getElementById('diffSummary');
      if(!d1Str||!d2Str){resultsEl.style.display='none';summaryEl.style.display='none';return;}
      const d1=new Date(d1Str+'T00:00:00');
      const d2=new Date(d2Str+'T00:00:00');
      let diffMs=Math.abs(d2.getTime()-d1.getTime());
      const totalDays=Math.round(diffMs/(1000*60*60*24));
      const totalHours=Math.round(diffMs/(1000*60*60));
      const totalMinutes=Math.round(diffMs/(1000*60));
      let years,months,days;
      if(d1<=d2){const r=dateDiff(d1,d2);years=r.years;months=r.months;days=r.days;}
      else{const r=dateDiff(d2,d1);years=r.years;months=r.months;days=r.days;}
      resultsEl.style.display='grid';
      resultsEl.innerHTML=diffStatHTML(years,'년')+diffStatHTML(months,'개월')+diffStatHTML(days,'일')+diffStatHTML(totalDays,'총 일수')+diffStatHTML(totalHours,'총 시간')+diffStatHTML(totalMinutes,'총 분');
      summaryEl.style.display='block';
      summaryEl.innerHTML='<strong>'+formatDateDisplay(d1Str)+'</strong>부터 <strong>'+formatDateDisplay(d2Str)+'</strong>까지 <strong>'+years+'년 '+months+'개월 '+days+'일</strong> ('+totalDays.toLocaleString()+'일)';
    }

    function dateDiff(start,end){
      let years=end.getFullYear()-start.getFullYear();
      let months=end.getMonth()-start.getMonth();
      let days=end.getDate()-start.getDate();
      if(days<0){months--;const prevMonth=new Date(end.getFullYear(),end.getMonth(),0);days+=prevMonth.getDate();}
      if(months<0){years--;months+=12;}
      return{years,months,days};
    }

    function diffStatHTML(value,label){
      return'<div class="diff-stat"><div class="diff-stat-value">'+value.toLocaleString()+'</div><div class="diff-stat-label">'+label+'</div></div>';
    }

    function formatDateISO(d){
      return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    }
    function formatDateDisplay(dateStr){
      const d=new Date(dateStr+'T00:00:00');
      const dayNames=['일','월','화','수','목','금','토'];
      return d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+dayNames[d.getDay()]+')';
    }
    function escHTML(str){const div=document.createElement('div');div.textContent=str;return div.innerHTML;}
  </script>
</body>
</html>
